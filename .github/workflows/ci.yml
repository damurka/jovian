name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          # Rtools (Windows only) is for compiling R packages with native
          # code, which we never do -- but this action's default (true) puts
          # its entire mingw toolchain (its own cmake.exe, g++.exe, and
          # bash.exe) on PATH ahead of everything else, which is what
          # actually caused the earlier "unset CC CXX" fix to not work: the
          # `cmake` it ran was Rtools' own bundled build, not a real
          # Windows/MSVC-aware one, so the *generator* choice was never
          # CMake auto-detecting wrong -- it was the wrong cmake.exe
          # entirely. Opting out is the actual fix.
          windows-path-include-rtools: false
          windows-path-include-mingw: false

      # carpo (native/src/carpo) dynamically loads Python at runtime the
      # same way elara loads R (native/src/carpo/py/py_dynlib.hpp) -- not a
      # build-time dependency for carpo.exe itself, but CarpoTest
      # (native/test/carpo/carpo_test.cpp) needs a real interpreter to embed
      # and exercise. native/test/CMakeLists.txt discovers it via CMake's
      # own find_package(Python3), which needs one actually on PATH -- the
      # runner images ship a Python already, but pinning it explicitly
      # (matching r-version: 'release' above) keeps this from silently
      # depending on whatever a given image happens to preinstall.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # hera is required for actually running code: SessionRegistryTest's
      # real-kernel tests (ExecuteRoundTripsThroughTheRealKernel and
      # friends) call hera:::hera_call("execute", ...) (native/src/r/
      # rtools.hpp) to evaluate anything at all. Only the kernel's *startup*
      # path tolerates hera being missing (RInterpreter::configureImpl()
      # logs a warning and continues), which is why the earlier "no R
      # packages needed" assumption here only held up through kernel_info/
      # registration-only tests, not real execution. All of hera's Imports
      # (packages/hera/DESCRIPTION) are on CRAN -- local::<path> installs
      # both those and hera itself.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::packages/hera

      - name: Install libuuid (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Clone and bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          cd "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's own binary cache (~/.cache/vcpkg or %LOCALAPPDATA%\vcpkg on
      # Windows) holds built port archives keyed by vcpkg.json's pinned
      # builtin-baseline -- this is what actually saves time on repeat runs
      # (rebuilding zeromq/openssl/etc. from source, as a fresh vcpkg clone
      # otherwise does every time, is the slow part; re-cloning vcpkg
      # itself is comparatively cheap).
      - name: Cache vcpkg archives
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/Library/Caches/vcpkg/archives
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      # This CMakeLists.txt assumes MSVC on Windows throughout once CMake
      # selects it (compile options, MSVC_RUNTIME_LIBRARY matching vcpkg's
      # triplet, the /STACK linker option) -- see the windows-path-include-*
      # comment above for why that selection needs help getting there at
      # all on this runner.
      - name: Configure native (Release)
        shell: bash
        run: |
          cmake -S . -B dist/native \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build native (elara + themisto + carpo)
        run: cmake --build dist/native --config Release

      # Separate build directory from dist/native, same reasoning as
      # scripts/test.js: JOVIAN_BUILD_TESTS=ON shouldn't stick around in
      # the main build's CMakeCache.
      - name: Configure native tests
        shell: bash
        run: |
          cmake -S . -B dist/native-test -DJOVIAN_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build dist/native-test --config Release

      - name: Run native tests (ctest)
        run: ctest --test-dir dist/native-test -C Release --output-on-failure --timeout 180

      # A real, pre-existing version conflict, unrelated to anything else
      # in this workflow: package.json pins typescript@^7.0.2, but
      # @typescript-eslint/eslint-plugin@^8.0.0's peer dependency wants
      # typescript <6.1.0. `npm ci`'s strict peer-dependency resolution
      # (unlike a plain `npm install`, which is more lenient) is what
      # surfaces this -- this is the first time `npm ci` has run against
      # this lockfile from a genuinely clean state. --legacy-peer-deps
      # doesn't change any declared version, just how npm resolves the
      # conflict; the real fix (pin an eslint-plugin version that supports
      # TS 7, or pin an older typescript) is a version decision for
      # whoever owns that choice, not something to make silently here.
      - name: npm ci
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        run: npx tsc --build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: node --test --test-force-exit test/integration/*.test.ts
