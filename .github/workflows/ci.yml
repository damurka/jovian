name: CI

# Built once, tested in parallel, as r-universe does:
#
#   library (TypeScript, unit tests)  --+
#   native, one per platform ----------+-> integration tests, per platform x (R, Python) version
#                                      +-> package smoke test, per platform (release.yml only)
#
# Each platform's kernels are built (and their native tests run) once; the
# integration tests then run against that build in parallel, on the oldest
# R and Python the kernels support and on the current ones -- the kernels load
# R and Python at run time, so a version they were not built with is what
# breaks. When release.yml calls this workflow with `package: true`, the
# npm packages are packed from the same builds. Nothing is built twice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: 'Also stage, pack and smoke-test the npm packages, and upload them as artifacts (release.yml)'
        type: boolean
        default: false
      version:
        description: 'Version of the packages, as a tag: v0.1.3'
        type: string
        default: ''

jobs:
  # ---- Build -------------------------------------------------------------------

  # The TypeScript library and its unit tests: the same on every platform, so once.
  library:
    name: library
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # typescript is TypeScript 6 (the API ESLint and the formatter use), @typescript/native TypeScript 7 (tsc)
      - name: npm ci
        run: npm ci

      - name: Build TypeScript
        run: npx tsc --build

      - name: Lint and formatting (VS Code's formatter, ESLint)
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: library
          path: dist/lib
          if-no-files-found: error

      # The main package is the same on every platform: packed here, once.
      - name: Pack the main package
        if: inputs.package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_NUMBER="${VERSION#v}"
          if ! [[ "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version tag like v0.1.0"; exit 1
          fi
          node scripts/release.mjs main --version "$VERSION_NUMBER"
          mkdir -p dist/release/tarballs
          (cd dist/release/jovian && npm pack --pack-destination ../tarballs)

      - name: Upload the main package
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: tarballs-main
          path: dist/release/tarballs/*.tgz
          if-no-files-found: error

  # The kernels, one build per platform, and their native tests.
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Oldest macOS the binaries run on (std::format of floats needs 13.3+).
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64,    os: windows-latest }
          - { target: linux-x64,    os: ubuntu-24.04 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64,   os: macos-15-intel }
          # Not supported (docs/releasing.md): win32-arm64 (R for Windows on ARM64 is
          # experimental and not on CRAN) and linux-armhf (32-bit ARM; GitHub has no
          # runner that can run 32-bit ARM code).

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          # Rtools (Windows only) is for compiling R packages with native
          # code, which we never do -- but this action's default (true) puts
          # its entire mingw toolchain (its own cmake.exe, g++.exe, and
          # bash.exe) on PATH ahead of everything else, which is what
          # actually caused the earlier "unset CC CXX" fix to not work: the
          # `cmake` it ran was Rtools' own bundled build, not a real
          # Windows/MSVC-aware one, so the *generator* choice was never
          # CMake auto-detecting wrong -- it was the wrong cmake.exe
          # entirely. Opting out is the actual fix.
          windows-path-include-rtools: false
          windows-path-include-mingw: false

      # carpo (native/src/carpo) dynamically loads Python at runtime the
      # same way elara loads R (native/src/carpo/py/py_dynlib.hpp) -- not a
      # build-time dependency for carpo itself, but CarpoTest
      # (native/test/carpo/carpo_test.cpp) needs a real interpreter to embed
      # and exercise. native/test/CMakeLists.txt discovers it via CMake's
      # own find_package(Python3), which needs one actually on PATH -- pinning
      # it explicitly keeps this from silently depending on whatever a given
      # image happens to preinstall.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install libuuid (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev

      - name: Clone and bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          cd "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      # vcpkg's own binary cache holds built port archives keyed by vcpkg.json's
      # pinned builtin-baseline -- this is what actually saves time on repeat
      # runs (rebuilding zeromq/openssl/etc. from source is the slow part).
      - name: Cache vcpkg archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/Library/Caches/vcpkg/archives
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ matrix.target }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-archives-${{ matrix.target }}-

      # This CMakeLists.txt assumes MSVC on Windows throughout once CMake
      # selects it (compile options, MSVC_RUNTIME_LIBRARY matching vcpkg's
      # triplet, the /STACK linker option) -- see the windows-path-include-*
      # comment above for why that selection needs help getting there at
      # all on this runner.
      #
      # One build, tests included: the release script ships only the kernels
      # (themisto, elara, carpo, callisto) and the libraries they need, never the test
      # binaries next to them.
      - name: Configure native (Release, with tests)
        shell: bash
        run: |
          cmake -S . -B dist/native -DJOVIAN_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build native (elara + themisto + carpo + callisto + tests)
        run: cmake --build dist/native --config Release

      - name: Run native tests (ctest)
        run: ctest --test-dir dist/native -C Release --output-on-failure --timeout 180

      # tar keeps the kernels' executable bit, which an artifact on its own loses (relative paths: Windows' GNU tar
      # reads "D:\..." as a remote host)
      - name: Bundle the kernels
        shell: bash
        run: tar -cf native.tar -C dist/native Release

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: native.tar
          if-no-files-found: error

      # ---- The platform package: only when release.yml asks for it -------------

      - name: Pack the platform package
        if: inputs.package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release.mjs platform --version "${VERSION#v}" --target ${{ matrix.target }}
          mkdir -p dist/release/tarballs
          (cd dist/release/jovian-${{ matrix.target }} && npm pack --pack-destination ../tarballs)

      - name: Upload the platform package
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: tarballs-${{ matrix.target }}
          path: dist/release/tarballs/*-${{ matrix.target }}-*.tgz
          if-no-files-found: error

  # ---- Test, in parallel ---------------------------------------------------------

  # The integration tests against each platform's build, on the oldest R and Python the kernels support and on the
  # current ones. R-devel runs too, on Linux, as an early warning that does not hold a release back.
  integration:
    name: integration ${{ matrix.target }} (R ${{ matrix.r }}, Python ${{ matrix.python }})
    needs: [library, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.r == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, linux-arm64, darwin-arm64, darwin-x64]
        r: [oldrel-1, release]
        include:
          - { target: win32-x64,    os: windows-latest }
          - { target: linux-x64,    os: ubuntu-24.04 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64,   os: macos-15-intel }
          - { r: oldrel-1, python: '3.10' }
          - { r: release,  python: '3.x' }
          - { target: linux-x64, os: ubuntu-24.04, r: devel, python: '3.x' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          windows-path-include-rtools: false
          windows-path-include-mingw: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # What the tests exercise beyond running code: 'later' (callbacks while a session is idle) and IRdisplay
      # (data frames and widgets as HTML). One job adds ragg, so plots are tested on both of hera's devices: ragg's
      # agg_record() and, everywhere else, R's own png()
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::later, any::IRdisplay${{ matrix.target == 'linux-x64' && matrix.r == 'release' && ', any::ragg' || '' }}

      - name: npm ci
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: library
          path: dist/lib

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.target }}

      - name: Unpack the kernels
        shell: bash
        run: mkdir -p dist/native && tar -xf native.tar -C dist/native

      - name: Integration tests
        run: node --test --test-force-exit test/integration/*.test.ts

  # The packed packages, installed into an empty project and run from there, starting from an R library with nothing
  # in it -- which they must leave empty: nothing is installed for the kernel to run.
  smoke:
    name: smoke ${{ matrix.target }}
    if: inputs.package
    needs: [library, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64,    os: windows-latest }
          - { target: linux-x64,    os: ubuntu-24.04 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64,   os: macos-15-intel }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          windows-path-include-rtools: false
          windows-path-include-mingw: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with:
          pattern: tarballs-*
          path: tarballs
          merge-multiple: true

      - name: Smoke test the packed packages (empty R library)
        shell: bash
        env:
          R_LIBS_USER: ${{ runner.temp }}/jovian-empty-r-library
        run: |
          mkdir -p smoke
          cp tarballs/damurka-jovian-[0-9]*.tgz tarballs/*-${{ matrix.target }}-*.tgz smoke/
          node scripts/release-smoke.mjs --dir smoke --python
