name: Release

# Publishes @damurka/jovian and its per-platform packages to npm.
# See docs/releasing.md. Push a tag `vX.Y.Z` (matching the version you want to
# publish) to release; run it by hand (workflow_dispatch) to build, test and
# smoke-test everything without publishing.
#
# The building, testing, packing and smoke-testing is ci.yml, called with
# `package: true`: one build per platform, shared with the normal CI. This file
# only adds the publish step. It must stay named release.yml: that is the
# workflow file name registered on npm as the trusted publisher of each package.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stage for a dry run (e.g. 0.1.0). Ignored for tag pushes.'
        required: false
        default: '0.0.0-dryrun'

jobs:
  verify:
    name: build, test and package
    uses: ./.github/workflows/ci.yml
    with:
      package: true
      version: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

  publish:
    name: publish to npm
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (and provenance): npm exchanges this for a short-lived credential
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          pattern: tarballs-*
          path: tarballs
          merge-multiple: true

      # No token anywhere: each package is registered on npmjs.com with this
      # repository and workflow (release.yml) as its trusted publisher, and npm
      # (>= 11.5.1) trades this job's OIDC identity for a credential. The
      # packages are published straight away (no staged queue to approve), with
      # provenance. The very first version of a new package is published by hand
      # (docs/releasing.md), since a trusted publisher can only be registered on
      # a package that exists.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Publish (platform packages first, then the main package)
        shell: bash
        run: |
          ls -l tarballs
          shopt -s nullglob
          # "./" matters: npm reads a bare tarballs/x.tgz as a GitHub user/repo shorthand.
          # A prerelease version (0.2.0-rc.1) must not become `latest`.
          TAG_ARGS=()
          if [[ "$VERSION" == *-* ]]; then TAG_ARGS=(--tag next); fi

          publish_one() {
            local f="$1" name version out
            name=$(tar -xzOf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            version=$(tar -xzOf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if out=$(npm view "$name@$version" version 2>&1) && [ -n "$out" ]; then
              # a re-run after a partial publish: this one is out already
              echo "$name@$version is already published, skipped"
            elif grep -q E404 <<< "$out" && ! npm view "$name" version > /dev/null 2>&1; then
              echo "::error::$name is not on npm yet: publish its first version by hand (docs/releasing.md), register this workflow as its trusted publisher, then re-run."
              exit 1
            else
              npm publish "./$f" --access public --provenance "${TAG_ARGS[@]}"
            fi
          }

          # the main package last: it depends on the platform packages at the same version
          for f in tarballs/damurka-jovian-*-*-*.tgz; do publish_one "$f"; done
          for f in tarballs/damurka-jovian-[0-9]*.tgz; do publish_one "$f"; done
