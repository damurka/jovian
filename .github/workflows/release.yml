name: Release

# Publishes @damurka/jovian and its per-platform packages to npm.
# See docs/releasing.md. Push a tag `vX.Y.Z` (matching the version you want to
# publish) to release; run it by hand (workflow_dispatch) to build, test and
# smoke-test everything without publishing.
#
# The building, testing, packing and smoke-testing is ci.yml, called with
# `package: true`: one build per platform, shared with the normal CI. This file
# only adds the publish step. It must stay named release.yml: that is the
# workflow file name registered on npm as the trusted publisher of each package.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stage for a dry run (e.g. 0.1.0). Ignored for tag pushes.'
        required: false
        default: '0.0.0-dryrun'

jobs:
  verify:
    name: build, test and package
    uses: ./.github/workflows/ci.yml
    with:
      package: true
      version: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

  publish:
    name: publish to npm
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (and provenance): npm exchanges this for a short-lived credential
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          pattern: tarballs-*
          path: tarballs
          merge-multiple: true

      # No token anywhere: each package is registered on npmjs.com with this
      # repository and workflow (release.yml) as its trusted publisher, and npm
      # (>= 11.5.1) trades this job's OIDC identity for a credential.
      #
      # npm requires staged publishing for CI: `npm stage publish` puts each
      # package in a queue; a maintainer then approves it with 2FA (`npm stage
      # list`, `npm stage approve <id>`, or on npmjs.com). It only works for a
      # package that already exists on the registry, so the very first version of
      # a new package is published by hand (docs/releasing.md). Needs npm >= 11.15.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Stage (platform packages first, then the main package)
        shell: bash
        run: |
          ls -l tarballs
          shopt -s nullglob
          # "./" matters: npm reads a bare tarballs/x.tgz as a GitHub user/repo shorthand.
          # A prerelease version (0.2.0-rc.1) must not become `latest`.
          TAG_ARGS=()
          if [[ "$VERSION" == *-* ]]; then TAG_ARGS=(--tag next); fi

          NEW_PACKAGES=()
          stage_one() {
            local f="$1" name out
            name=$(tar -xzOf "$f" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            if out=$(npm view "$name" version 2>&1); then
              npm stage publish "./$f" --access public --provenance "${TAG_ARGS[@]}"
            elif grep -q E404 <<< "$out"; then
              # npm cannot stage the first version of a package that does not exist yet.
              echo "::warning::$name is not on npm yet, and npm cannot stage a package's first version. Publish it by hand from the tarball in this run's artifacts: npm publish ./$(basename "$f") --access public --provenance=false"
              NEW_PACKAGES+=("$name")
            else
              echo "::error::could not look up $name on npm: $out"; exit 1
            fi
          }

          for f in tarballs/damurka-jovian-*-*-*.tgz; do stage_one "$f"; done
          for f in tarballs/damurka-jovian-[0-9]*.tgz; do stage_one "$f"; done

          echo "Staged. Approve each (platform packages first, the main package last) with 2FA:"
          echo "  npm stage list && npm stage approve <stage-id>   (or on npmjs.com)"
          if [ ${#NEW_PACKAGES[@]} -gt 0 ]; then
            echo "Publish these NEW packages by hand BEFORE approving the main package: ${NEW_PACKAGES[*]}"
          fi
